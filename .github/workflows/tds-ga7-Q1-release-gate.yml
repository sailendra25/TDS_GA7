name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 22f1001730@ds.study.iitm.ac.in
        run: echo "TDS identity: 22f1001730@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Q1
        run: pip install -r requirements.txt

      - name: Start service
        working-directory: Q1
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Test release gate
        working-directory: Q1
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "target": "production",
              "event": "push",
              "ref": "refs/heads/main",
              "workflow": {
                  "trigger": "push",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "environmentApproval": True,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      },
                      {
                          "owner": "docker",
                          "name": "build-push-action",
                          "ref": "1234567890abcdef1234567890abcdef12345678"
                      }
                  ]
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          request = urllib.request.Request(
              "http://127.0.0.1:8000/release-gate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          print(json.dumps(result))

          assert result["decision"] == "promote"
          assert result["violations"] == []
          PY
          assert result["violations"] == []
          PY
